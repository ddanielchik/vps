services:
  users-db:
    image: postgres:17
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    volumes:
      - users-data:/var/lib/postgresql/data

  menu-db:
    image: postgres:17
    environment:
      POSTGRES_DB: menu
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
    volumes:
      - menu-data:/var/lib/postgresql/data

  visits-db:
    image: postgres:17
    environment:
      POSTGRES_DB: visits
      POSTGRES_USER: visits
      POSTGRES_PASSWORD: visits
    volumes:
      - visits-data:/var/lib/postgresql/data

  config-service:
    build:
      context: .
      args:
        MODULE: config-service
    environment:
      CONFIG_REPOSITORY: /config
    volumes:
      - ./config-repository:/config:ro
    restart: on-failure

  discovery-service:
    build:
      context: .
      args:
        MODULE: discovery-service
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
    ports:
      - "8761:8761"
    depends_on:
      - config-service
    restart: on-failure

  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOSTNAME: user-service
      APP_JWT_SECRET: "${LAB3_JWT_SECRET:?Set LAB3_JWT_SECRET}"
      APP_LORD_EMAIL: "${LAB3_LORD_EMAIL:?Set LAB3_LORD_EMAIL}"
      APP_LORD_PASSWORD: "${LAB3_LORD_PASSWORD:?Set LAB3_LORD_PASSWORD}"
      DB_USERNAME: users
      DB_PASSWORD: users
      R2DBC_URL: r2dbc:postgresql://users-db:5432/users
      JDBC_URL: jdbc:postgresql://users-db:5432/users
    depends_on:
      - config-service
      - discovery-service
      - users-db
    restart: on-failure

  menu-service:
    build:
      context: .
      args:
        MODULE: menu-service
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOSTNAME: menu-service
      DB_USERNAME: menu
      DB_PASSWORD: menu
      DB_URL: jdbc:postgresql://menu-db:5432/menu
    depends_on:
      - config-service
      - discovery-service
      - menu-db
    restart: on-failure

  visit-order-service:
    build:
      context: .
      args:
        MODULE: visit-order-service
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOSTNAME: visit-order-service
      DB_USERNAME: visits
      DB_PASSWORD: visits
      DB_URL: jdbc:postgresql://visits-db:5432/visits
    depends_on:
      - config-service
      - discovery-service
      - visits-db
    restart: on-failure

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_URL: http://discovery-service:8761/eureka/
      EUREKA_HOSTNAME: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - config-service
      - discovery-service
    restart: on-failure

volumes:
  users-data:
  menu-data:
  visits-data:
